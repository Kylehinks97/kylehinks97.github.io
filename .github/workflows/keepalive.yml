name: Keepalive

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. This is Monday 09:00 UTC (1 hour before the contact form test).
    - cron: "0 9 * * 1"

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bump timestamp
        run: |
          echo "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" > .github/keepalive.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keepalive $(date -u +"%Y-%m-%d")"
          git push
